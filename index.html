<title>Speak Up - Elsewedy Digital</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;padding:16px}
.box{max-width:540px;margin:0 auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:14px;margin-bottom:14px}
.logo img{display:block;height:56px;width:auto}
.header h1{margin:0;font-size:32px;font-weight:900;color:#0f1e3a}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:18px;line-height:1.6}
label{display:block;margin:16px 0 6px;font-weight:700;font-size:13px}
select,input,textarea{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:14px}
.upload{border:2px dashed #ff6a00;border-radius:12px;padding:18px;text-align:center;background:#fff8f2;cursor:pointer;display:block}
.upload span{color:#ff6a00;font-weight:800}
#preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#preview img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.hint{font-size:12px;color:#888;margin-top:6px}
.btn{width:100%;margin-top:22px;background:#ff6a00;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.7}
.thanks{display:none;text-align:center;padding:40px 10px}
.thanks .check{width:64px;height:64px;background:#e6f9ed;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;color:#0a7a2e}
</style>

<div class="sub">Report a safety concern in under a minute.<br>بلغ عن ملاحظة سلامة في اقل من دقيقة</div>
<form id="speakForm">
<input type="hidden" name="access_key" value="bd3a160b-0304-49bb-a19f-d10ff17adb36">
<input type="hidden" name="subject" value="📣 New Speak Up Report">
<input type="hidden" name="from_name" value="Speak Up System">
<label>Observation type - نوع الملاحظة</label>
<select name="Observation Type" required><option value="">Select / اختر</option><option>Unsafe act / تصرف غير آمن</option><option>Unsafe condition / حالة غير آمنة</option><option>Positive act / تصرف إيجابي</option><option>Near miss / حادث وشيك</option><option>Other / أخرى</option></select>
<label>Location - مكان الملاحظة</label><input name="Location" required placeholder="BM - Data Center A">
<label>Description - وصف الملاحظة</label><textarea name="Description" required rows="4" placeholder="بدون خوذة / What did you see?"></textarea>
<label>Add photo - إضافة صورة (up to 3)</label>
<div style="display:flex;gap:8px">
<label class="upload" for="fileCam" style="flex:1;padding:14px 6px"><span>📷 Camera<br>كاميرا</span></label>

</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="hint" id="hint"></div>
<input type="hidden" name="Photo Link" id="photoLink">
<div id="preview"></div>
<label>Reporter name (optional)</label><input name="Reporter" placeholder="Name or ID">

<button class="btn" id="submitBtn" type="submit">Submit / ارسال</button>
</form>
</div>
<div class="box thanks" id="thanksBox">
<div class="check">✓</div>
<h2>Thank you!<br>شكراً لك!</h2>
<p><b>Your vigilance keeps Elsewedy Digital safe.</b><br>يقظتك هي ما يجعل السويدي ديجيتال بيئة عمل آمنة.</p>
</div>
<script>
// ===== SETTINGS =====
// Free key from https://api.imgbb.com  (sign up -> "Get API key")
const IMGBB_KEY = 'PASTE_YOUR_IMGBB_KEY_HERE';
const MAX_PHOTOS = 3;
// true  = photos arrive as EMAIL ATTACHMENTS (requires Web3Forms PRO; if not available the report is still sent, without photos)
// false = photos are uploaded to imgbb and a link is added to the email
const USE_ATTACHMENTS = false;
// ====================

const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
document.getElementById('dateField').value=now.toISOString().slice(0,16);

const file=document.getElementById('file'), prev=document.getElementById('preview'),
      photoLink=document.getElementById('photoLink'), hint=document.getElementById('hint');
let photos=[];

const fileCam=document.getElementById('fileCam');
function addPhotos(list){
  photos=photos.concat([...list]);
  hint.textContent=photos.length>MAX_PHOTOS?('Only the first '+MAX_PHOTOS+' photos will be sent / سيتم ارسال اول '+MAX_PHOTOS+' صور فقط'):'';
  photos=photos.slice(0,MAX_PHOTOS);
  prev.innerHTML='';
  photos.forEach(f=>{const r=new FileReader();r.onload=e=>{const im=document.createElement('img');im.src=e.target.result;prev.appendChild(im);};r.readAsDataURL(f);});
}
file.onchange=()=>{addPhotos(file.files);file.value='';};
fileCam.onchange=()=>{addPhotos(fileCam.files);fileCam.value='';};

// shrink phone photos (often 4-8 MB) to ~1280px JPEG before upload
function compress(f){
  return new Promise(res=>{
    const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{
      const s=Math.min(1,1280/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{URL.revokeObjectURL(url);res(b||f);},'image/jpeg',0.8);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(f);};
    img.src=url;
  });
}

function fetchT(url,opt,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,Object.assign({},opt,{signal:c.signal})).finally(()=>clearTimeout(t));
}
async function uploadOne(f){
  const blob=await compress(f);
  const fd=new FormData(); fd.append('image',blob,'photo.jpg');
  const r=await fetchT('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd},30000);
  let j=null; try{ j=await r.json(); }catch(_){}
  if(j&&j.success&&j.data&&j.data.url) return j.data.url;
  throw new Error((j&&j.error&&j.error.message)?j.error.message:('HTTP '+r.status));
}

document.getElementById('speakForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn'); btn.disabled=true;
  try{
    const fd=new FormData(e.target);
    let sendWithFiles=false;
    if(photos.length){
      if(USE_ATTACHMENTS){
        btn.textContent='Preparing photos... / جاري تجهيز الصور';
        let i=0;
        for(const f of photos){ i++; const blob=await compress(f); fd.append('photo'+i,blob,'speakup-photo-'+i+'.jpg'); }
        sendWithFiles=true;
      }else if(IMGBB_KEY.indexOf('PASTE_')===0){
        fd.set('Photo Link','Photo not uploaded (upload key not configured)');
      }else{
        let n=0; const links=[]; let lastErr='';
        for(const f of photos){ n++; btn.textContent='Uploading photo '+n+'/'+photos.length+'... / جاري رفع الصورة'; try{ links.push(await uploadOne(f)); }catch(er){ lastErr=(er.name==='AbortError')?'timeout (slow network or blocked)':er.message; } }
        fd.set('Photo Link',links.length?links.join('\n'):'Photo upload failed ('+lastErr+') - ask reporter for the photo');
      }
    }
    btn.textContent='Sending... / جاري الارسال';
    let res=await fetchT('https://api.web3forms.com/submit',{method:'POST',body:fd},60000);
    let data=await res.json().catch(()=>({success:false}));
    if(!data.success && sendWithFiles){
      // attachments rejected (e.g. no PRO plan): never lose the report, resend without photos
      const fd2=new FormData(e.target);
      fd2.set('Photo Link','Photos could not be attached ('+(data.message||'attachment error')+') - ask reporter for the photos');
      res=await fetchT('https://api.web3forms.com/submit',{method:'POST',body:fd2},30000);
      data=await res.json().catch(()=>({success:false}));
      if(data.success) alert('Report sent, but photos could not be attached.\nتم ارسال البلاغ ولكن تعذر ارفاق الصور.');
    }
    if(data.success){
      document.getElementById('formBox').style.display='none';
      document.getElementById('thanksBox').style.display='block';
    }else{ throw new Error(data.message||'Send failed'); }
  }catch(err){
    alert('Error: '+((err.name==='AbortError')?'timeout':err.message)+'\nحاول مرة اخرى');
    btn.textContent='Submit / ارسال'; btn.disabled=false;
  }
});
</script>
